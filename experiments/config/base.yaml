# Base configuration shared across all experiments
seed: 42
num_seeds: 3  # repeat each experiment with 3 seeds for error bars

# Paths
data_dir: "./data/raw"
processed_dir: "./data/processed"
checkpoint_dir: "./checkpoints"
results_dir: "./results"

# Shared reaction encoder
encoder:
  d_model: 256
  n_layers: 4
  n_heads: 4
  d_ff: 1024
  dropout: 0.1
  max_seq_len: 512
  vocab_size: 256  # SMILES regex tokenizer

# Training defaults
training:
  batch_size: 128
  lr: 3.0e-4
  weight_decay: 1.0e-5
  warmup_steps: 1000
  max_epochs: 100
  patience: 15
  gradient_clip: 1.0
  num_workers: 4

# Logging
wandb:
  project: "rasyn-robust-synthesis"
  entity: null  # set to your wandb entity
